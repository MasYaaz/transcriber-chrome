[package]
name = "transcriber-chrome"
version = "0.1.0"
edition = "2024"

[dependencies]
whisper-rs = { version = "0.16.0", features = ["cuda"] }
tokio = { version = "1.53.1", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
