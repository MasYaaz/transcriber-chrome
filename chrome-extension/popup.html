<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family:
                    "Inter",
                    system-ui,
                    -apple-system,
                    sans-serif;
            }
            body {
                width: 280px;
                background-color: #0f172a;
                color: #f8fafc;
                padding: 16px;
            }
            .header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 16px;
            }
            .title {
                font-size: 14px;
                font-weight: 700;
                letter-spacing: 0.5px;
                background: linear-gradient(135deg, #38bdf8, #818cf8);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }
            .badge {
                font-size: 10px;
                padding: 2px 8px;
                border-radius: 12px;
                background: #1e293b;
                color: #94a3b8;
                border: 1px solid #334155;
            }
            .status-card {
                background: #1e293b;
                border: 1px solid #334155;
                border-radius: 10px;
                padding: 12px;
                margin-bottom: 16px;
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: #64748b;
            }
            .dot.active {
                background: #22c55e;
                box-shadow: 0 0 10px #22c55e88;
                animation: pulse 1.5s infinite;
            }
            @keyframes pulse {
                0% {
                    transform: scale(0.95);
                    opacity: 0.8;
                }
                50% {
                    transform: scale(1.1);
                    opacity: 1;
                }
                100% {
                    transform: scale(0.95);
                    opacity: 0.8;
                }
            }
            .status-text {
                font-size: 12px;
                color: #cbd5e1;
                font-weight: 500;
            }
            .btn {
                width: 100%;
                padding: 12px;
                border: none;
                border-radius: 8px;
                font-weight: 600;
                font-size: 13px;
                cursor: pointer;
                transition: all 0.2s;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
            }
            .btn-start {
                background: #0284c7;
                color: white;
            }
            .btn-start:hover {
                background: #0369a1;
            }
            .btn-stop {
                background: #ef4444;
                color: white;
            }
            .btn-stop:hover {
                background: #dc2626;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <div class="title">MeetSync AI</div>
            <div class="badge">v1.0 Local</div>
        </div>

        <div class="status-card">
            <div id="dotStatus" class="dot"></div>
            <div id="textStatus" class="status-text">Siap Merekam</div>
        </div>

        <button id="btnAction" class="btn btn-start">
            <span>▶ Start Recording</span>
        </button>

        <script src="popup.js"></script>
    </body>
</html>
